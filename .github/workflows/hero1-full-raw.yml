name: Publish Hero1 Full Raw APK

permissions:
  contents: write

on:
  push:
    branches: [hero1-build]
    paths:
      - ".github/workflows/hero1-full-raw.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hero1-build

      - name: Download full APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download hero1-soltia-full-original             -R chazmfozj/Wand-Enhancer             -p 'hero1_soltia_full_original_features.apk'             -D downloads
          sha256sum downloads/hero1_soltia_full_original_features.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/hero1_soltia_full_original_features.apk
          git commit -m "hero1: publish full original feature APK direct download"
          git push origin HEAD:hero1-build
