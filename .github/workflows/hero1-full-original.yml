name: Build Hero1 Full Original Features APK

permissions:
  contents: write

on:
  push:
    branches: [hero1-build]
    paths:
      - ".github/workflows/hero1-full-original.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hero1-build

      - uses: actions/checkout@v4
        with:
          repository: dlunch/wie
          ref: main
          path: wie
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Select Android NDK
        shell: bash
        run: |
          ndk_home=${ANDROID_NDK_LATEST_HOME:-$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)}
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,tauri-cli

      - name: Install exact original game archive
        shell: bash
        run: |
          mkdir -p wie/wie-web/src/assets
          cp hero1/original_game.zip wie/wie-web/src/assets/hero1_game.zip
          test "$(sha256sum wie/wie-web/src/assets/hero1_game.zip | awk '{print $1}')" = "d558d6c6d42b1bbaf2f31e5499897be14f735d99b22e292b8efa8dffc723f5b9"

      - name: Apply core cheat patch
        run: python hero1/patch.py wie

      - name: Apply original UI patch
        run: python hero1/original_ui_patch.py wie

      - name: Apply mapping and save features
        run: python hero1/original_features_patch.py wie

      - name: Apply persistent cheat manager
        run: python hero1/cheat_manager_patch.py wie

      - name: Build frontend
        working-directory: wie
        run: |
          npm ci
          npm run build:prod

      - name: Init Android
        working-directory: wie/wie-app
        run: cargo tauri android init --ci

      - name: Sign release
        shell: bash
        run: |
          cat >> wie/wie-app/gen/android/app/build.gradle.kts <<'EOF'

          android {
              buildTypes.getByName("release") {
                  signingConfig = signingConfigs.getByName("debug")
              }
          }
          EOF

      - name: Build APK
        working-directory: wie/wie-app
        run: cargo tauri android build --target aarch64 --apk --ci --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect
        shell: bash
        run: |
          apk=$(find wie/wie-app/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" hero1_soltia_full_original_features.apk
          ls -lh hero1_soltia_full_original_features.apk
          sha256sum hero1_soltia_full_original_features.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hero1-soltia-full-original -R chazmfozj/Wand-Enhancer --cleanup-tag -y || true
          gh release create hero1-soltia-full-original             -R chazmfozj/Wand-Enhancer             --target hero1-build             --title "Hero1 Soltia Full Original Features"             --notes "Original game data, original-style keypad, draggable CHEAT, pad mapping, mapping preset import/export, save import/export."             hero1_soltia_full_original_features.apk
